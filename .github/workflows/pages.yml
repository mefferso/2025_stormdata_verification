name: Build and publish LIX storm data dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Force fresh IEM download (ignore cache)
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: lix-2025-analysis-fast-pass
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: https://mefferso.github.io/2025_stormdata_verification/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install processing dependencies
        run: pip install -r requirements.txt
      - name: Bundle pinned frontend libraries
        run: |
          npm install --no-save --prefix /tmp/lix-vendor plotly.js-dist-min@2.35.2 leaflet@1.9.4
          mkdir -p site/vendor/leaflet
          cp /tmp/lix-vendor/node_modules/plotly.js-dist-min/plotly.min.js site/vendor/plotly.min.js
          cp /tmp/lix-vendor/node_modules/leaflet/dist/leaflet.js site/vendor/leaflet/leaflet.js
          cp /tmp/lix-vendor/node_modules/leaflet/dist/leaflet.css site/vendor/leaflet/leaflet.css
          cp -R /tmp/lix-vendor/node_modules/leaflet/dist/images site/vendor/leaflet/images
          test -s site/vendor/plotly.min.js
          test -s site/vendor/leaflet/leaflet.js
      - name: Cache public IEM archive
        uses: actions/cache@v4
        with:
          path: .cache/iem
          key: iem-lix-2025-v3-${{ github.run_id }}
          restore-keys: |
            iem-lix-2025-v3-
      - name: Execute offline QC tests
        run: python -m pytest tests -q
      - name: Ingest public archives and build research results
        shell: bash
        run: |
          REFRESH=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$(jq -r '.inputs.refresh // "false"' "$GITHUB_EVENT_PATH")" = "true" ]; then
            REFRESH="--refresh"
          fi
          python -m src.build --cache .cache/iem --output site $REFRESH
      - name: Validate actual output
        run: |
          python -m src.validate site/data
          python -m pytest tests/test_pipeline.py -q
          node --check site/app.js
          node tests/test_frontend.cjs
      - name: Save reproducible 2025 analysis results
        uses: actions/upload-artifact@v4
        with:
          name: lix-2025-research-results
          path: site/data/
          retention-days: 90
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
      - name: Install headless browser
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Verify published dashboard in Chromium
        run: python tests/browser_smoke.py https://mefferso.github.io/2025_stormdata_verification/
